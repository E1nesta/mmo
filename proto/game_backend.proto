syntax = "proto3";

package game_backend.proto;

message RequestContext {
  string trace_id = 1;
  uint64 request_id = 2;
  string auth_token = 3;
  int64 player_id = 4;
  int64 account_id = 5;
  int64 gateway_timestamp_ms = 6;
  string gateway_signature = 7;
}

message ResponseContext {
  string trace_id = 1;
  uint64 request_id = 2;
  string auth_token = 3;
  int64 player_id = 4;
  int64 account_id = 5;
}

message PingRequest {
  RequestContext context = 1;
  string message = 2;
}

message PingResponse {
  ResponseContext context = 1;
  string message = 2;
}

message ErrorResponse {
  ResponseContext context = 1;
  int32 error_code = 2;
  string error_name = 3;
  string error_message = 4;
}

message PlayerStageProgress {
  int32 stage_id = 1;
  int32 best_star = 2;
  bool is_first_clear = 3;
}

message PlayerProfile {
  int64 player_id = 1;
  int64 account_id = 2;
  string player_name = 3;
  int32 level = 4;
  int32 stamina = 5;
  int64 gold = 6;
  int64 diamond = 7;
  int32 server_id = 8;
  string nickname = 9;
  int32 main_stage_id = 10;
  int64 fight_power = 11;
  int32 main_chapter_id = 12;
}

message CurrencyBalance {
  string currency_type = 1;
  int64 amount = 2;
}

message RoleSummary {
  int32 role_id = 1;
  int32 level = 2;
  int32 star = 3;
}

message PlayerState {
  PlayerProfile profile = 1;
  repeated PlayerStageProgress stage_progress = 2;
  repeated CurrencyBalance currencies = 3;
  repeated RoleSummary role_summaries = 4;
}

message HomePlayerDisplay {
  int64 player_id = 1;
  int64 account_id = 2;
  int32 server_id = 3;
  string player_name = 4;
  string nickname = 5;
  int32 level = 6;
}

message HomeResourceSummary {
  int32 stamina = 1;
  int64 gold = 2;
  int64 diamond = 3;
  repeated CurrencyBalance currencies = 4;
}

message HomeCharacterSummary {
  int64 fight_power = 1;
  repeated RoleSummary role_summaries = 2;
}

message HomeDungeonSummary {
  int32 main_stage_id = 1;
  int32 main_chapter_id = 2;
  repeated PlayerStageProgress stage_progress = 3;
  int32 stage_progress_count = 4;
}

message HomeActivitySummary {
  bool hydrated = 1;
}

message HomeEntryStateSummary {
  bool hydrated = 1;
}

message HomeInitData {
  HomePlayerDisplay player_display = 1;
  HomeResourceSummary resource_summary = 2;
  HomeCharacterSummary character_summary = 3;
  HomeDungeonSummary dungeon_summary = 4;
  HomeActivitySummary activity_summary = 5;
  HomeEntryStateSummary entry_state_summary = 6;
}

message Reward {
  string reward_type = 1;
  int64 amount = 2;
}

message DungeonUseItem {
  int32 item_id = 1;
  int32 amount = 2;
}

message DungeonBattleStats {
  int32 pass_time_seconds = 1;
  int32 dungeon_rank = 2;
  int32 master_be_hit = 3;
  int32 use_ougi = 4;
  int32 dodge_seconds = 5;
  int32 heal_sum = 6;
  int32 be_harm = 7;
  int32 kill_enemy = 8;
  int32 master_combo = 9;
  string dungeon_report_json = 10;
}

message LoginRequest {
  RequestContext context = 1;
  string account_name = 2;
  string password = 3;
  string client_ip = 4;
  string device_id = 5;
}

message LoginResponse {
  ResponseContext context = 1;
  reserved 2 to 5;
  string auth_token = 6;
  int64 account_id = 7;
  int64 player_id = 8;
  int64 expires_at_epoch_seconds = 9;
}

message GateLoginRequest {
  RequestContext context = 1;
  string auth_token = 2;
  string session_id = 3;
  string token = 4;
  int64 player_id = 5;
  int32 line_no = 6;
  int32 anti_addi = 7;
  string device_id = 8;
}

message GateLoginResponse {
  ResponseContext context = 1;
  bool success = 2;
  int64 player_id = 3;
  string session_id = 4;
  int32 line_no = 5;
  uint64 connection_id = 6;
}

message GateRelinkRequest {
  RequestContext context = 1;
  string auth_token = 2;
  string session_id = 3;
  int64 player_id = 4;
  int32 line_no = 5;
  string device_id = 6;
}

message GateRelinkResponse {
  ResponseContext context = 1;
  bool success = 2;
  int64 player_id = 3;
  string session_id = 4;
  int32 line_no = 5;
  uint64 connection_id = 6;
}

message GateKick {
  ResponseContext context = 1;
  string message = 2;
}

message GateNotification {
  ResponseContext context = 1;
  int32 type = 2;
  int64 timestamp = 3;
}

message PublishGateNotificationRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int32 type = 3;
  int64 timestamp = 4;
  bool remote_forwarded = 5;
}

message PublishGateNotificationResponse {
  ResponseContext context = 1;
  bool player_online = 2;
  bool delivered = 3;
}

message KickPlayerRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  string reason = 3;
  bool remote_forwarded = 4;
}

message KickPlayerResponse {
  ResponseContext context = 1;
  bool player_online = 2;
  bool delivered = 3;
}

message LoadPlayerRequest {
  RequestContext context = 1;
  int64 player_id = 2;
}

message LoadPlayerResponse {
  ResponseContext context = 1;
  reserved 2 to 5;
  HomeInitData home_init = 6;
  bool loaded_from_cache = 7;
}

message PlayerSnapshotRequest {
  RequestContext context = 1;
  int64 player_id = 2;
}

message PlayerSnapshotResponse {
  ResponseContext context = 1;
  bool found = 2;
  int64 player_id = 3;
  int32 level = 4;
  int32 stamina = 5;
  string nickname = 6;
  int64 gold = 7;
  int64 diamond = 8;
  int32 main_stage_id = 9;
  int32 main_chapter_id = 10;
  int64 fight_power = 11;
  repeated CurrencyBalance currencies = 12;
  repeated RoleSummary role_summaries = 13;
  int32 stage_progress_count = 14;
}

message EnterDungeonRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int32 stage_id = 3;
  string mode = 4;
  int32 loadout_id = 5;
  repeated DungeonUseItem use_item_list = 6;
}

message EnterDungeonResponse {
  ResponseContext context = 1;
  reserved 2 to 5;
  int64 session_id = 6;
  int32 remain_stamina = 7;
  int64 seed = 8;
  string settle_token = 9;
}

message SettleDungeonRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int64 session_id = 3;
  int32 stage_id = 4;
  int32 star = 5;
  int32 result_code = 6;
  int64 client_score = 7;
  string settle_token = 8;
  DungeonBattleStats battle_stats = 9;
}

message SettleDungeonResponse {
  ResponseContext context = 1;
  reserved 2 to 5;
  int64 reward_grant_id = 6;
  int32 grant_status = 7;
  repeated Reward reward_preview = 8;
  repeated DungeonUseItem use_item_list = 9;
}

message GetSettlementGrantStatusRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int64 reward_grant_id = 3;
}

message GetSettlementGrantStatusResponse {
  ResponseContext context = 1;
  int64 reward_grant_id = 2;
  int32 grant_status = 3;
  repeated Reward granted_rewards = 4;
}

message GetActiveDungeonRequest {
  RequestContext context = 1;
  int64 player_id = 2;
}

message GetActiveDungeonResponse {
  ResponseContext context = 1;
  bool found = 2;
  int64 session_id = 3;
  int32 stage_id = 4;
  string mode = 5;
  int32 remain_stamina = 6;
  int64 seed = 7;
  string settle_token = 8;
}

message DungeonDramaEnterRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int32 stage_id = 3;
  int32 loadout_id = 4;
  repeated DungeonUseItem use_item_list = 5;
}

message DungeonDramaEnterResponse {
  ResponseContext context = 1;
  int64 session_id = 2;
  int32 remain_stamina = 3;
  int64 seed = 4;
  string settle_token = 5;
}

message DungeonGeneralEnterRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int32 stage_id = 3;
  int32 loadout_id = 4;
  repeated DungeonUseItem use_item_list = 5;
}

message DungeonGeneralEnterResponse {
  ResponseContext context = 1;
  int64 session_id = 2;
  int32 remain_stamina = 3;
  int64 seed = 4;
  string settle_token = 5;
}

message DungeonDramaResultRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int64 session_id = 3;
  int32 stage_id = 4;
  int32 result_code = 5;
  int32 star = 6;
  int64 client_score = 7;
  string settle_token = 8;
  DungeonBattleStats battle_stats = 9;
}

message DungeonDramaResultResponse {
  ResponseContext context = 1;
  int64 reward_grant_id = 2;
  int32 grant_status = 3;
  repeated Reward reward_preview = 4;
  repeated int32 new_star_list = 5;
  repeated Reward first_rewards = 6;
  bool detail_hydrated = 7;
}

message DungeonGeneralResultRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  int64 session_id = 3;
  int32 stage_id = 4;
  int32 result_code = 5;
  int32 star = 6;
  int64 client_score = 7;
  string settle_token = 8;
  DungeonBattleStats battle_stats = 9;
}

message DungeonGeneralResultResponse {
  ResponseContext context = 1;
  int64 reward_grant_id = 2;
  int32 grant_status = 3;
  repeated Reward reward_preview = 4;
  repeated int32 new_star_list = 5;
  repeated DungeonUseItem use_item_list = 6;
  int32 daily_limit = 7;
  bool detail_hydrated = 8;
}

message FriendSummary {
  int64 player_id = 1;
  string nickname = 2;
  int32 level = 3;
  bool online = 4;
}

message ListFriendsRequest {
  RequestContext context = 1;
  int64 player_id = 2;
}

message ListFriendsResponse {
  ResponseContext context = 1;
  repeated FriendSummary friends = 2;
}

message ConversationSummary {
  string conversation_id = 1;
  string title = 2;
  int32 unread_count = 3;
  string last_message_preview = 4;
}

message ListConversationsRequest {
  RequestContext context = 1;
  int64 player_id = 2;
}

message ListConversationsResponse {
  ResponseContext context = 1;
  repeated ConversationSummary conversations = 2;
}

message ChatMessage {
  string message_id = 1;
  int64 sender_player_id = 2;
  string content = 3;
  int64 sent_at_epoch_ms = 4;
}

message GetChatHistoryRequest {
  RequestContext context = 1;
  int64 player_id = 2;
  string conversation_id = 3;
}

message GetChatHistoryResponse {
  ResponseContext context = 1;
  repeated ChatMessage messages = 2;
}

message SocialFriendNotification {
  ResponseContext context = 1;
  string title = 2;
  string body = 3;
}

message SocialChatPush {
  ResponseContext context = 1;
  string conversation_id = 2;
  ChatMessage message = 3;
}
