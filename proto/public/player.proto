syntax = "proto3";

package mmo.public_api;

import "common/context.proto";
import "common/types.proto";

message ApplyRewardRequest {
  mmo.common.RequestContext context = 1;
  string idempotency_key = 2;
  repeated mmo.common.Reward rewards = 3;
}

message ApplyRewardResponse {
  mmo.common.ResponseContext context = 1;
  bool applied = 2;
  int64 gold = 3;
  int64 exp = 4;
}
