syntax = "proto3";

package mmo.public_api;

import "common/context.proto";

message CastSkillRequest {
  mmo.common.RequestContext context = 1;
  int64 attacker_id = 2;
  int64 target_id = 3;
  int32 skill_id = 4;
}

message CastSkillResponse {
  mmo.common.ResponseContext context = 1;
  int64 attacker_id = 2;
  int64 target_id = 3;
  int32 skill_id = 4;
  int64 damage = 5;
  bool target_dead = 6;
}
