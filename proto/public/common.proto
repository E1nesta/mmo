syntax = "proto3";

package mmo.public_api;

message RequestContext {
  uint64 request_id = 1;
  int64 account_id = 2;
  int64 player_id = 3;
  string session_token = 4;
  string trace_id = 5;
}

message ResponseContext {
  uint64 request_id = 1;
  int64 account_id = 2;
  int64 player_id = 3;
  string session_token = 4;
  string trace_id = 5;
  bool success = 6;
  int32 error_code = 7;
  string error_message = 8;
}

message Envelope {
  uint64 request_id = 1;
  string message_type = 2;
  int64 player_id = 3;
  string session_token = 4;
  bytes payload = 5;
}

message Position {
  float x = 1;
  float y = 2;
  float z = 3;
}

message SceneRoute {
  int32 map_id = 1;
  int32 line_id = 2;
  int64 scene_id = 3;
}

message Reward {
  string type = 1;
  int64 amount = 2;
}
