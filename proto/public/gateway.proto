syntax = "proto3";

package mmo.public_api;

import "common/context.proto";

message GateLoginRequest {
  mmo.common.RequestContext context = 1;
  int64 player_id = 2;
  string session_token = 3;
  string device_id = 4;
  string gateway_ticket = 5;
}

message GateLoginResponse {
  mmo.common.ResponseContext context = 1;
  bool bound = 2;
  uint64 connection_id = 3;
}

message PingRequest {
  mmo.common.RequestContext context = 1;
  int64 client_time_ms = 2;
}

message PingResponse {
  mmo.common.ResponseContext context = 1;
  int64 server_time_ms = 2;
}
