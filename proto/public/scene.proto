syntax = "proto3";

package mmo.public_api;

import "common/context.proto";
import "common/types.proto";

message EnterSceneRequest {
  mmo.common.RequestContext context = 1;
  mmo.common.SceneRoute route = 2;
}

message EnterSceneResponse {
  mmo.common.ResponseContext context = 1;
  int64 entity_id = 2;
  mmo.common.Position position = 3;
}

message MoveCommand {
  mmo.common.RequestContext context = 1;
  int64 entity_id = 2;
  mmo.common.Position from = 3;
  mmo.common.Position to = 4;
  int64 client_time_ms = 5;
}

message MoveResult {
  mmo.common.ResponseContext context = 1;
  int64 entity_id = 2;
  mmo.common.Position accepted_position = 3;
}
