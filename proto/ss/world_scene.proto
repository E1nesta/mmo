syntax = "proto3";

package mmo.ss;

import "common/error.proto";
import "common/types.proto";

message AllocateSceneEntityRequest {
  mmo.common.SceneRoute route = 2;
}

message AllocateSceneEntityResponse {
  mmo.common.Result result = 1;
  int64 entity_id = 2;
  mmo.common.Position position = 3;
}
