syntax = "proto3";

package mmo.common;

message Envelope {
  uint64 request_id = 1;
  string message_type = 2;
  int64 player_id = 3;
  string session_token = 4;
  bytes payload = 5;
  string source_service = 6;
  int64 internal_timestamp_millis = 7;
  string internal_signature = 8;
  string game_session_id = 9;
  string trace_id = 10;
}
