syntax = "proto3";

package mmo.common;

message RequestContext {
  uint64 request_id = 1;
  int64 account_id = 2;
  int64 player_id = 3;
  string session_token = 4;
  string trace_id = 5;
  string game_session_id = 9;
}

message ResponseContext {
  uint64 request_id = 1;
  int64 account_id = 2;
  int64 player_id = 3;
  string session_token = 4;
  string trace_id = 5;
  bool success = 6;
  int32 error_code = 7;
  string error_message = 8;
  string game_session_id = 9;
}
