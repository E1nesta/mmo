syntax = "proto3";

package mmo.internal_api;

import "common/context.proto";

message GatewaySocialBoundaryRequest {
  mmo.common.RequestContext context = 1;
  int64 target_player_id = 2;
}

message GatewaySocialBoundaryResponse {
  mmo.common.ResponseContext context = 1;
  bool friend_boundary_available = 2;
  bool chat_boundary_available = 3;
  bool team_boundary_available = 4;
}
