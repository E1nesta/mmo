# Minimal production-style HTTPS termination sample for api_gateway_server.
# Keep certificate private keys outside the repository and mount them at deploy time.

events {}

http {
    upstream mmo_api_gateway {
        server 127.0.0.1:4100;
        keepalive 64;
    }

    limit_req_zone $binary_remote_addr zone=mmo_api_login:10m rate=20r/s;

    server {
        listen 443 ssl http2;
        server_name mmo.example.com;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /v1/login {
            limit_req zone=mmo_api_login burst=40 nodelay;
            proxy_pass http://mmo_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-Id $request_id;
        }

        location /v1/servers {
            proxy_pass http://mmo_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-Id $request_id;
        }
    }

    server {
        listen 80;
        server_name mmo.example.com;
        return 308 https://$host$request_uri;
    }
}
