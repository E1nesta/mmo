x-backend-service: &backend-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: mobile_game_backend:local
  restart: unless-stopped
  env_file:
    - ${BACKEND_ENV_FILE:-./.env.demo}

services:
  dungeon_schema_migrator:
    image: mysql:8.0
    restart: "no"
    env_file:
      - ${BACKEND_ENV_FILE:-./.env.demo}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["sh", "-lc"]
    command:
      - mysql -hmysql -uroot -p"$MYSQL_ROOT_PASSWORD" < /docker-entrypoint-initdb.d/003_commercial_game_schema.sql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./.env.demo}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_demo_v6:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./.env.demo}
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth_server:
    <<: *backend-service
    command: ["./auth_server", "--config", "configs/auth_server.conf"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/auth_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  player_query_server:
    <<: *backend-service
    command: ["./player_query_server", "--config", "configs/player_query_server.conf"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/player_query_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  player_write_grpc_server:
    <<: *backend-service
    command: ["./player_write_grpc_server", "--config", "configs/player_write_grpc_server.conf"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PLAYER_WRITE_GRPC_PORT:-7400}"]
      interval: 5s
      timeout: 3s
      retries: 20

  dungeon_runtime_server:
    <<: *backend-service
    command: ["./dungeon_runtime_server", "--config", "configs/dungeon_runtime_server.conf"]
    depends_on:
      dungeon_schema_migrator:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      player_write_grpc_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/dungeon_runtime_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  social_server:
    <<: *backend-service
    command: ["./social_server", "--config", "configs/social_server.conf"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/social_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  online_gateway_1:
    <<: *backend-service
    command: ["./online_gateway_server", "--config", "configs/online_gateway_server.conf"]
    environment:
      SERVICE_INSTANCE_ID: online_gateway_1
      SERVICE_ADVERTISE_HOST: online_gateway_1
      SERVICE_ADVERTISE_PORT: "7000"
      TRANSPORT_PROXY_PROTOCOL_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/online_gateway_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  online_gateway_2:
    <<: *backend-service
    command: ["./online_gateway_server", "--config", "configs/online_gateway_server.conf"]
    environment:
      SERVICE_INSTANCE_ID: online_gateway_2
      SERVICE_ADVERTISE_HOST: online_gateway_2
      SERVICE_ADVERTISE_PORT: "7000"
      TRANSPORT_PROXY_PROTOCOL_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./service_check", "--config", "configs/online_gateway_server.conf", "--mode", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  api_gateway_server:
    <<: *backend-service
    command: ["./api_gateway_server", "--config", "configs/api_gateway_server.conf"]
    environment:
      SERVICE_INSTANCE_ID: api_gateway_1
    depends_on:
      auth_server:
        condition: service_healthy
      player_query_server:
        condition: service_healthy
      dungeon_runtime_server:
        condition: service_healthy
      social_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${API_GATEWAY_PORT:-8080}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./.env.demo}
    ports:
      - "8080:8080"
      - "7000:7000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_gateway_server:
        condition: service_healthy
      online_gateway_1:
        condition: service_healthy
      online_gateway_2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data_demo_v6:
