worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;

    upstream api_gateway_backend {
        least_conn;
        server api_gateway_server:8080 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api_gateway_backend;
        }
    }
}

stream {
    log_format stream_basic '$remote_addr [$time_local] '
                            '$protocol $status $bytes_sent $bytes_received '
                            '$session_time "$upstream_addr"';

    access_log /dev/stdout stream_basic;
    error_log /dev/stderr info;

    upstream online_gateways {
        least_conn;
        server online_gateway_1:7000 max_fails=1 fail_timeout=2s;
        server online_gateway_2:7000 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 7000;
        proxy_connect_timeout 1s;
        proxy_timeout 30s;
        proxy_protocol on;
        proxy_pass online_gateways;
    }
}
