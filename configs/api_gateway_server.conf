# Local api gateway config
service.name=api_gateway_server
service.instance_id=${SERVICE_INSTANCE_ID:-api-gateway-local}
runtime.environment=local
log.level=info
log.format=text
http.listen.host=0.0.0.0
http.listen.port=${API_GATEWAY_PORT:-8080}
security.trusted_gateway.shared_secret=${TRUSTED_GATEWAY_SHARED_SECRET:-local-dev-gateway-shared-secret}
storage.session.redis.host=${REDIS_HOST:-127.0.0.1}
storage.session.redis.port=${REDIS_PORT:-6379}
storage.session.redis.password=${REDIS_PASSWORD:-}
storage.session.redis.timeout_ms=${REDIS_TIMEOUT_MS:-2000}
storage.session.redis.pool_size=${REDIS_POOL_SIZE:-4}
upstream.timeout_ms=${UPSTREAM_TIMEOUT_MS:-3000}
upstream.pool_size=${UPSTREAM_POOL_SIZE:-2}
upstream.auth.host=${AUTH_UPSTREAM_HOST:-127.0.0.1}
upstream.auth.port=${AUTH_UPSTREAM_PORT:-7100}
upstream.player_query.host=${PLAYER_QUERY_UPSTREAM_HOST:-127.0.0.1}
upstream.player_query.port=${PLAYER_QUERY_UPSTREAM_PORT:-7200}
upstream.dungeon_runtime.host=${DUNGEON_RUNTIME_UPSTREAM_HOST:-127.0.0.1}
upstream.dungeon_runtime.port=${DUNGEON_RUNTIME_UPSTREAM_PORT:-7300}
upstream.social.host=${SOCIAL_UPSTREAM_HOST:-127.0.0.1}
upstream.social.port=${SOCIAL_UPSTREAM_PORT:-7500}
