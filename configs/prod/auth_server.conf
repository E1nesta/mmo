# Production auth service config
service.name=auth_server
runtime.environment=prod
service.listen.host=0.0.0.0
service.listen.port=${AUTH_PORT:-7100}
runtime.shutdown_grace_ms=${RUNTIME_SHUTDOWN_GRACE_MS:-5000}
transport.io_threads=${TRANSPORT_IO_THREADS:-2}
transport.idle_timeout_ms=${TRANSPORT_IDLE_TIMEOUT_MS:-30000}
transport.write_queue_limit=${TRANSPORT_WRITE_QUEUE_LIMIT:-512}
transport.max_packet_body_bytes=${TRANSPORT_MAX_PACKET_BODY_BYTES:-4194304}
transport.tls.enabled=${TRANSPORT_TLS_ENABLED:-true}
transport.tls.cert_file=${TRANSPORT_TLS_CERT_FILE:-/etc/game_backend/tls/auth_server.crt}
transport.tls.key_file=${TRANSPORT_TLS_KEY_FILE:-/etc/game_backend/tls/auth_server.key}
transport.tls.ca_file=${TRANSPORT_TLS_CA_FILE:-/etc/game_backend/tls/ca.pem}
transport.tls.verify_peer=${TRANSPORT_TLS_VERIFY_PEER:-false}
execution.worker_threads=${EXECUTION_WORKER_THREADS:-4}
execution.shard_count=${EXECUTION_SHARD_COUNT:-4}
execution.queue_limit=${EXECUTION_QUEUE_LIMIT:-4096}
security.trusted_gateway.shared_secret=${TRUSTED_GATEWAY_SHARED_SECRET:-}
security.trusted_gateway.max_clock_skew_ms=${TRUSTED_GATEWAY_MAX_CLOCK_SKEW_MS:-10000}
log.level=${LOG_LEVEL:-info}
log.format=json
storage.account.mysql.writer.host=${ACCOUNT_MYSQL_HOST:-mysql}
storage.account.mysql.writer.port=${ACCOUNT_MYSQL_PORT:-3306}
storage.account.mysql.writer.user=${ACCOUNT_MYSQL_USER:-game}
storage.account.mysql.writer.password=${ACCOUNT_MYSQL_PASSWORD:-}
storage.account.mysql.writer.database=${ACCOUNT_MYSQL_DATABASE:-account_db}
storage.account.mysql.writer.pool_size=${ACCOUNT_MYSQL_POOL_SIZE:-16}
storage.player.mysql.writer.host=${PLAYER_MYSQL_HOST:-mysql}
storage.player.mysql.writer.port=${PLAYER_MYSQL_PORT:-3306}
storage.player.mysql.writer.user=${PLAYER_MYSQL_USER:-game}
storage.player.mysql.writer.password=${PLAYER_MYSQL_PASSWORD:-}
storage.player.mysql.writer.database=${PLAYER_MYSQL_DATABASE:-player_db}
storage.player.mysql.writer.pool_size=${PLAYER_MYSQL_POOL_SIZE:-16}
storage.session.redis.host=${ACCOUNT_REDIS_HOST:-redis}
storage.session.redis.port=${ACCOUNT_REDIS_PORT:-6379}
storage.session.redis.password=${ACCOUNT_REDIS_PASSWORD:-}
storage.session.redis.timeout_ms=${ACCOUNT_REDIS_TIMEOUT_MS:-2000}
storage.session.redis.pool_size=${ACCOUNT_REDIS_POOL_SIZE:-16}
storage.session.ttl_seconds=${SESSION_TTL_SECONDS:-3600}
