# Production online gateway config
service.name=online_gateway_server
service.instance_id=${SERVICE_INSTANCE_ID:-online-gateway-prod}
runtime.environment=prod
service.listen.host=0.0.0.0
service.listen.port=${ONLINE_GATEWAY_PORT:-7000}
service.advertise.host=${SERVICE_ADVERTISE_HOST:-}
service.advertise.port=${SERVICE_ADVERTISE_PORT:-0}
runtime.shutdown_grace_ms=${RUNTIME_SHUTDOWN_GRACE_MS:-5000}
transport.io_threads=${TRANSPORT_IO_THREADS:-2}
transport.idle_timeout_ms=${TRANSPORT_IDLE_TIMEOUT_MS:-30000}
transport.write_queue_limit=${TRANSPORT_WRITE_QUEUE_LIMIT:-512}
transport.max_packet_body_bytes=${TRANSPORT_MAX_PACKET_BODY_BYTES:-4194304}
transport.proxy_protocol.enabled=${TRANSPORT_PROXY_PROTOCOL_ENABLED:-false}
transport.tls.enabled=${TRANSPORT_TLS_ENABLED:-true}
transport.tls.cert_file=${TRANSPORT_TLS_CERT_FILE:-/etc/game_backend/tls/online_gateway_server.crt}
transport.tls.key_file=${TRANSPORT_TLS_KEY_FILE:-/etc/game_backend/tls/online_gateway_server.key}
transport.tls.ca_file=${TRANSPORT_TLS_CA_FILE:-/etc/game_backend/tls/ca.pem}
transport.tls.verify_peer=${TRANSPORT_TLS_VERIFY_PEER:-false}
upstream.tls.enabled=${UPSTREAM_TLS_ENABLED:-true}
upstream.tls.ca_file=${UPSTREAM_TLS_CA_FILE:-/etc/game_backend/tls/ca.pem}
upstream.tls.server_name=${UPSTREAM_TLS_SERVER_NAME:-}
upstream.tls.verify_peer=${UPSTREAM_TLS_VERIFY_PEER:-false}
execution.worker_threads=${EXECUTION_WORKER_THREADS:-4}
execution.shard_count=${EXECUTION_SHARD_COUNT:-4}
execution.queue_limit=${EXECUTION_QUEUE_LIMIT:-4096}
security.trusted_gateway.shared_secret=${TRUSTED_GATEWAY_SHARED_SECRET:-}
security.trusted_gateway.max_clock_skew_ms=${TRUSTED_GATEWAY_MAX_CLOCK_SKEW_MS:-10000}
online.presence.ttl_seconds=${ONLINE_PRESENCE_TTL_SECONDS:-120}
online.forward.timeout_ms=${ONLINE_FORWARD_TIMEOUT_MS:-1000}
online.forward.pool_size=${ONLINE_FORWARD_POOL_SIZE:-2}
log.level=${LOG_LEVEL:-info}
log.format=json
storage.session.redis.host=${REDIS_HOST:-redis}
storage.session.redis.port=${REDIS_PORT:-6379}
storage.session.redis.password=${REDIS_PASSWORD:-}
storage.session.redis.timeout_ms=${REDIS_TIMEOUT_MS:-2000}
storage.session.redis.pool_size=${REDIS_POOL_SIZE:-16}
storage.session.ttl_seconds=${SESSION_TTL_SECONDS:-3600}
