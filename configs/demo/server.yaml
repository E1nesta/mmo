environment: demo

network:
  bind_host: "0.0.0.0"
  public_host_env: "MMO_PUBLIC_HOST"

services:
  api_gateway_server:
    host_env: "MMO_API_GATEWAY_HOST"
    tcp_port: 4100
  auth_server:
    host_env: "MMO_AUTH_HOST"
    tcp_port: 4101
  game_gateway_server:
    host_env: "MMO_GAME_GATEWAY_HOST"
    tcp_port: 4102
    udp_kcp_port: 4202
  world_server:
    host_env: "MMO_WORLD_HOST"
    tcp_port: 4103
  scene_server:
    host_env: "MMO_SCENE_HOST"
    tcp_port: 4104
  instance_server:
    host_env: "MMO_INSTANCE_HOST"
    tcp_port: 4105
  player_server:
    host_env: "MMO_PLAYER_HOST"
    tcp_port: 4106
  social_server:
    host_env: "MMO_SOCIAL_HOST"
    tcp_port: 4107
  realtime_gateway_server:
    host_env: "MMO_REALTIME_GATEWAY_HOST"
    tcp_port: 4108
    udp_kcp_port: 4208

transport:
  tcp:
    max_frame_payload_bytes: 1048576
    timeout_millis: 3000
    listen_backlog: 128
    max_connections: 4096
    max_write_queue_depth: 1024
  kcp:
    nodelay: 1
    interval_millis: 20
    fast_resend: 2
    disable_congestion_control: 1
    send_window: 256
    receive_window: 256

storage:
  mysql:
    host_env: "MMO_MYSQL_HOST"
    port_env: "MMO_MYSQL_PORT"
    database_env: "MMO_MYSQL_DATABASE"
    user_env: "MMO_MYSQL_USER"
    password_env: "MMO_MYSQL_PASSWORD"
    pool_size: 16
  redis:
    host_env: "MMO_REDIS_HOST"
    port_env: "MMO_REDIS_PORT"
    database_env: "MMO_REDIS_DATABASE"
    password_env: "MMO_REDIS_PASSWORD"
    pool_size: 16

scheduler:
  io_threads: 2
  handler_shards: 4
  max_handler_queue_depth_per_shard: 1024
  player_shards: 4
  scene_shards: 4
  instance_shards: 2

rpc:
  connect_timeout_millis: 1000
  request_timeout_millis: 3000
  connections_per_upstream: 2
  max_pending_requests_per_connection: 128
  max_pending_requests_per_upstream: 256

security:
  internal_auth:
    shared_secret_env: "MMO_INTERNAL_AUTH_SHARED_SECRET"
    max_clock_skew_millis: 10000
  gateway_ticket:
    shared_secret_env: "MMO_GATEWAY_TICKET_SHARED_SECRET"
    issuer: "mmo-auth"
    access_audience: "api_gateway_server"
    gateway_audience: "game_gateway_server"
    active_key_id: "demo-v1"
    active_shared_secret_env: "MMO_GATEWAY_TICKET_ACTIVE_SECRET"
    previous_key_id_env: "MMO_GATEWAY_TICKET_PREVIOUS_KEY_ID"
    previous_shared_secret_env: "MMO_GATEWAY_TICKET_PREVIOUS_SECRET"
    previous_key_accept_millis: 0
    gateway_ticket_ttl_millis: 60000
    access_token_ttl_millis: 3600000
  gateway_session:
    gateway_id: "game_gateway_server-demo"
    game_session_ttl_millis: 1800000
    heartbeat_timeout_millis: 30000
    reconnect_ticket_ttl_millis: 60000

observability:
  log_level: "info"
  log_format: "structured"
