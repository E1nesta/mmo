# Delivery player write grpc server config
service.name=player_write_grpc_server
runtime.environment=staging
log.level=info
log.format=text
grpc.listen.host=0.0.0.0
grpc.listen.port=${PLAYER_WRITE_GRPC_PORT:-7400}
storage.player.mysql.writer.host=${PLAYER_MYSQL_HOST:-mysql}
storage.player.mysql.writer.port=${PLAYER_MYSQL_PORT:-3306}
storage.player.mysql.writer.user=${PLAYER_MYSQL_USER:-game}
storage.player.mysql.writer.password=${PLAYER_MYSQL_PASSWORD:-gamepass}
storage.player.mysql.writer.database=${PLAYER_MYSQL_DATABASE:-player_db}
storage.player.mysql.writer.pool_size=${PLAYER_MYSQL_POOL_SIZE:-4}
storage.player_cache.redis.host=${PLAYER_REDIS_HOST:-redis}
storage.player_cache.redis.port=${PLAYER_REDIS_PORT:-6379}
storage.player_cache.redis.password=${PLAYER_REDIS_PASSWORD:-}
storage.player_cache.redis.timeout_ms=${PLAYER_REDIS_TIMEOUT_MS:-2000}
storage.player_cache.redis.pool_size=${PLAYER_REDIS_POOL_SIZE:-4}
storage.player.snapshot_ttl_seconds=${PLAYER_SNAPSHOT_TTL_SECONDS:-300}
