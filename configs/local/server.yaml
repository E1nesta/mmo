environment: local

network:
  bind_host: "0.0.0.0"
  public_host: "127.0.0.1"

services:
  api_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4100
  auth_server:
    host: "127.0.0.1"
    tcp_port: 4101
  game_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4102
    udp_kcp_port: 4202
  world_server:
    host: "127.0.0.1"
    tcp_port: 4103
  scene_server:
    host: "127.0.0.1"
    tcp_port: 4104
  instance_server:
    host: "127.0.0.1"
    tcp_port: 4105
  player_server:
    host: "127.0.0.1"
    tcp_port: 4106
  social_server:
    host: "127.0.0.1"
    tcp_port: 4107
  realtime_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4108
    udp_kcp_port: 4208

transport:
  tcp:
    max_envelope_payload_bytes: 1048576
    timeout_millis: 3000
    listen_backlog: 64
  kcp:
    nodelay: 1
    interval_millis: 20
    fast_resend: 2
    disable_congestion_control: 1
    send_window: 128
    receive_window: 128

storage:
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "mmo_local"
    user: "mmo"
    password_env: "MMO_MYSQL_PASSWORD"
    pool_size: 8
  redis:
    host: "127.0.0.1"
    port: 6379
    database: 0
    password_env: "MMO_REDIS_PASSWORD"
    pool_size: 8

execution:
  io_threads: 2
  handler_shards: 4
  max_handler_queue_depth_per_shard: 1024
  player_shards: 4
  scene_shards: 4
  instance_shards: 2

channel:
  connect_timeout_millis: 1000
  request_timeout_millis: 3000
  connections_per_upstream: 2
  max_pending_requests_per_connection: 128
  max_pending_requests_per_upstream: 256

security:
  internal_auth:
    shared_secret: "local-dev-internal-auth-shared-secret"
    max_clock_skew_millis: 10000
  gateway_ticket:
    shared_secret: "local-dev-gateway-ticket-shared-secret"
    gateway_ticket_ttl_millis: 60000
    access_token_ttl_millis: 3600000

observability:
  log_level: "info"
  log_format: "structured"
