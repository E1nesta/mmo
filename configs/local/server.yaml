environment: local

network:
  bind_host: "0.0.0.0"
  public_host: "127.0.0.1"

services:
  api_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4100
    instances:
      - instance_id: "api-gateway-1"
        host: "127.0.0.1"
        tcp_port: 4100
        zone: "local-a"
        weight: 100
        state: "healthy"
  auth_server:
    host: "127.0.0.1"
    tcp_port: 4101
    instances:
      - instance_id: "auth-1"
        host: "127.0.0.1"
        tcp_port: 4101
        zone: "local-a"
        weight: 100
        state: "healthy"
  game_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4102
    udp_kcp_port: 4202
    instances:
      - instance_id: "game-gateway-1"
        host: "127.0.0.1"
        tcp_port: 4102
        udp_kcp_port: 4202
        zone: "local-a"
        weight: 100
        state: "healthy"
  world_server:
    host: "127.0.0.1"
    tcp_port: 4103
    instances:
      - instance_id: "world-1"
        host: "127.0.0.1"
        tcp_port: 4103
        zone: "local-a"
        weight: 100
        state: "healthy"
  scene_server:
    host: "127.0.0.1"
    tcp_port: 4104
    instances:
      - instance_id: "scene-1"
        host: "127.0.0.1"
        tcp_port: 4104
        zone: "local-a"
        weight: 100
        state: "healthy"
  instance_server:
    host: "127.0.0.1"
    tcp_port: 4105
    instances:
      - instance_id: "instance-1"
        host: "127.0.0.1"
        tcp_port: 4105
        zone: "local-a"
        weight: 100
        state: "healthy"
  player_server:
    host: "127.0.0.1"
    tcp_port: 4106
    instances:
      - instance_id: "player-1"
        host: "127.0.0.1"
        tcp_port: 4106
        zone: "local-a"
        weight: 100
        state: "healthy"
  social_server:
    host: "127.0.0.1"
    tcp_port: 4107
    instances:
      - instance_id: "social-1"
        host: "127.0.0.1"
        tcp_port: 4107
        zone: "local-a"
        weight: 100
        state: "healthy"
  realtime_gateway_server:
    host: "127.0.0.1"
    tcp_port: 4108
    udp_kcp_port: 4208
    instances:
      - instance_id: "realtime-gateway-1"
        host: "127.0.0.1"
        tcp_port: 4108
        udp_kcp_port: 4208
        zone: "local-a"
        weight: 100
        state: "healthy"

transport:
  tcp:
    max_frame_payload_bytes: 1048576
    timeout_millis: 3000
    listen_backlog: 64
    max_connections: 2048
    max_write_queue_depth: 1024
  kcp:
    nodelay: 1
    interval_millis: 20
    fast_resend: 2
    disable_congestion_control: 1
    send_window: 128
    receive_window: 128

storage:
  mysql:
    host: "127.0.0.1"
    port: 13306
    port_env: "MMO_MYSQL_PORT"
    database: "mmo_local"
    user: "mmo"
    password_env: "MMO_MYSQL_PASSWORD"
    pool_size: 8
  redis:
    host: "127.0.0.1"
    port: 6379
    database: 0
    password_env: "MMO_REDIS_PASSWORD"
    pool_size: 8

scheduler:
  io_threads: 2
  handler_shards: 4
  max_handler_queue_depth_per_shard: 1024
  player_shards: 4
  scene_shards: 4
  instance_shards: 2

rpc:
  connect_timeout_millis: 1000
  request_timeout_millis: 3000
  connections_per_upstream: 2
  max_pending_requests_per_connection: 128
  max_pending_requests_per_upstream: 256

security:
  internal_auth:
    shared_secret: "local-dev-internal-auth-shared-secret"
    max_clock_skew_millis: 10000
  gateway_ticket:
    shared_secret: "local-dev-gateway-ticket-shared-secret"
    issuer: "mmo-auth"
    access_audience: "api_gateway_server"
    gateway_audience: "game_gateway_server"
    active_key_id: "local-v1"
    active_shared_secret: "local-dev-gateway-ticket-shared-secret"
    previous_key_accept_millis: 0
    gateway_ticket_ttl_millis: 60000
    access_token_ttl_millis: 3600000
  gateway_session:
    gateway_id: "game_gateway_server-local"
    game_session_ttl_millis: 1800000
    heartbeat_timeout_millis: 30000
    reconnect_ticket_ttl_millis: 60000

observability:
  log_level: "info"
  log_format: "structured"
