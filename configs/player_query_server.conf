# Local player query service config
service.name=player_query_server
runtime.environment=local
service.listen.host=0.0.0.0
service.listen.port=${PLAYER_QUERY_PORT:-7200}
runtime.shutdown_grace_ms=${RUNTIME_SHUTDOWN_GRACE_MS:-5000}
transport.io_threads=${TRANSPORT_IO_THREADS:-1}
transport.idle_timeout_ms=${TRANSPORT_IDLE_TIMEOUT_MS:-30000}
transport.write_queue_limit=${TRANSPORT_WRITE_QUEUE_LIMIT:-128}
transport.max_packet_body_bytes=${TRANSPORT_MAX_PACKET_BODY_BYTES:-4194304}
transport.tls.enabled=${TRANSPORT_TLS_ENABLED:-false}
transport.tls.cert_file=${TRANSPORT_TLS_CERT_FILE:-}
transport.tls.key_file=${TRANSPORT_TLS_KEY_FILE:-}
transport.tls.ca_file=${TRANSPORT_TLS_CA_FILE:-}
transport.tls.verify_peer=${TRANSPORT_TLS_VERIFY_PEER:-false}
execution.worker_threads=${EXECUTION_WORKER_THREADS:-1}
execution.shard_count=${EXECUTION_SHARD_COUNT:-1}
execution.queue_limit=${EXECUTION_QUEUE_LIMIT:-1024}
security.trusted_gateway.shared_secret=${TRUSTED_GATEWAY_SHARED_SECRET:-local-dev-gateway-shared-secret}
security.trusted_gateway.max_clock_skew_ms=${TRUSTED_GATEWAY_MAX_CLOCK_SKEW_MS:-10000}
log.level=info
log.format=text
storage.player.mysql.writer.host=${PLAYER_MYSQL_HOST:-127.0.0.1}
storage.player.mysql.writer.port=${PLAYER_MYSQL_PORT:-3307}
storage.player.mysql.writer.user=${PLAYER_MYSQL_USER:-game}
storage.player.mysql.writer.password=${PLAYER_MYSQL_PASSWORD:-gamepass}
storage.player.mysql.writer.database=${PLAYER_MYSQL_DATABASE:-player_db}
storage.player.mysql.writer.pool_size=${PLAYER_MYSQL_POOL_SIZE:-4}
storage.player.mysql.reader.host=${PLAYER_MYSQL_READER_HOST:-127.0.0.1}
storage.player.mysql.reader.port=${PLAYER_MYSQL_READER_PORT:-3307}
storage.player.mysql.reader.user=${PLAYER_MYSQL_READER_USER:-game}
storage.player.mysql.reader.password=${PLAYER_MYSQL_READER_PASSWORD:-gamepass}
storage.player.mysql.reader.database=${PLAYER_MYSQL_READER_DATABASE:-player_db}
storage.player.mysql.reader.pool_size=${PLAYER_MYSQL_READER_POOL_SIZE:-4}
storage.player_cache.redis.host=${PLAYER_REDIS_HOST:-127.0.0.1}
storage.player_cache.redis.port=${PLAYER_REDIS_PORT:-6379}
storage.player_cache.redis.password=${PLAYER_REDIS_PASSWORD:-}
storage.player_cache.redis.timeout_ms=${PLAYER_REDIS_TIMEOUT_MS:-2000}
storage.player_cache.redis.pool_size=${PLAYER_REDIS_POOL_SIZE:-4}
storage.player.snapshot_ttl_seconds=${PLAYER_SNAPSHOT_TTL_SECONDS:-300}
